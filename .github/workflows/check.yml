name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install release-test dependency
        run: python -m pip install -r tools/requirements-release.txt
      - name: Test publisher and map tools
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Android tests, lint and APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:testPlayUnitTest :app:lintDebug :app:lintPlay :app:assembleDebug :app:assemblePlay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JWMaps-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
